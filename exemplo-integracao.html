<!--
  EXEMPLO DE INTEGRAÇÃO — Feed / Mural
  =====================================
  Este ficheiro NÃO é para usar sozinho — é um guia com código real,
  mostrando como ligar UMA parte do teu portal-do-aluno-notas_6_.html
  (o feed/mural, S.posts) à API, sem precisar de reescrever a app toda
  de uma vez.

  A ideia central: o teu app já funciona com um ciclo síncrono
  render() que lê o objeto S e desenha o HTML. Isso não muda. O que
  muda é DE ONDE vem o conteúdo de S: em vez de vir escrito à mão no
  início do ficheiro, passa a vir do servidor via fetch(), e depois
  de chegar, chamas render() outra vez. S continua a ser a "memória
  de trabalho" da página — só que agora é alimentada pela base de
  dados.

  Passo a passo abaixo. Os números de linha referem-se ao teu ficheiro
  portal-do-aluno-notas_6_.html original.
-->


<!-- ═══════════════════════════════════════════════════════════════
     PASSO 1 — Perto do topo do <script> (logo depois de "use strict"
     ou do início da IIFE, antes de "var S = {"), define o endereço
     da API:
     ═══════════════════════════════════════════════════════════════ -->

<script>
  var API_URL = "http://localhost:3001";

  // Pequeno helper para não repetir fetch + tratamento de erro em todo o lado.
  function apiGet(caminho) {
    return fetch(API_URL + caminho).then(function (r) { return r.json(); });
  }
  function apiPost(caminho, corpo) {
    return fetch(API_URL + caminho, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpo)
    }).then(function (r) { return r.json(); });
  }
</script>


<!-- ═══════════════════════════════════════════════════════════════
     PASSO 2 — Carregar as publicações da escola a partir da API.

     No ficheiro original, S.posts já vem todo preenchido à mão
     (linha ~1409). Podes deixar esse array como fallback/exemplo,
     mas adicionas esta função que o substitui pelos dados reais:
     ═══════════════════════════════════════════════════════════════ -->

<script>
  // Ainda precisamos de saber o ID numérico da escola (a API trabalha
  // com id, o protótipo trabalha com "slug"). Fazemos essa ponte aqui.
  var escolaIdAtual = null;

  function carregarFeedDaEscola(slug) {
    apiGet("/api/escolas/" + slug).then(function (escola) {
      escolaIdAtual = escola.id;
      return apiGet("/api/publicacoes?escola_id=" + escola.id);
    }).then(function (posts) {
      // Convertemos o formato da API para o formato que feedHTML() já espera,
      // para não termos de tocar em feedHTML() nem em nenhum outro sítio
      // que já lê S.posts.
      S.posts = posts.map(function (p) {
        return {
          id: "p" + p.id,
          tag: p.tag,
          author: p.autor_nome || "__school__",
          time: formatarTempoRelativo(p.criado_em),
          schoolSlug: slug,
          body: p.corpo
        };
      });
      render();
    }).catch(function (err) {
      console.error("Não foi possível carregar o feed:", err);
      // S.posts fica como estava (os dados de exemplo) — a app continua a funcionar.
    });
  }

  // Função simples de apoio — substitui os "há 2 horas" / "ontem" fixos
  // por um cálculo real a partir de criado_em.
  function formatarTempoRelativo(isoString) {
    var diffMs = Date.now() - new Date(isoString.replace(" ", "T") + "Z").getTime();
    var minutos = Math.round(diffMs / 60000);
    if (minutos < 60) return "há " + minutos + " min";
    var horas = Math.round(minutos / 60);
    if (horas < 24) return "há " + horas + " horas";
    return "há " + Math.round(horas / 24) + " dias";
  }
</script>


<!-- ═══════════════════════════════════════════════════════════════
     PASSO 3 — Chamar carregarFeedDaEscola() sempre que uma escola é
     escolhida. No ficheiro original isso acontece em vários pontos
     onde "S.currentSchoolSlug = ..." é definido (ex.: ao escolher a
     escola no ecrã de login, ou ao trocar de escola no menu).

     Onde vires algo como:

         S.currentSchoolSlug = slug;
         S.schoolName = escola.name;
         render();

     troca por:

         S.currentSchoolSlug = slug;
         S.schoolName = escola.name;
         render();                        // desenha já com o que houver
         carregarFeedDaEscola(slug);       // e atualiza assim que a API responder
     ═══════════════════════════════════════════════════════════════ -->


<!-- ═══════════════════════════════════════════════════════════════
     PASSO 4 — Publicar um novo post através da API.

     O handler "publish" (perto da linha 4178) hoje só guarda em
     S.publishedByModule. Para o feed principal (S.posts), o
     equivalente seria um handler assim:
     ═══════════════════════════════════════════════════════════════ -->

<script>
  // Dentro do objeto `formHandlers`, adiciona (ou troca) esta entrada:
  var exemploHandlerPublicarNoFeed = {
    "publicar-aviso-feed": function (form) {
      var titulo = form.t.value.trim();
      var corpo = form.b.value.trim();
      if (!titulo) return;

      apiPost("/api/publicacoes", {
        escola_id: escolaIdAtual,
        autor_id: null,       // ou o id do utilizador autenticado, quando existir
        tag: "Aviso",
        corpo: titulo + (corpo ? " — " + corpo : "")
      }).then(function () {
        // depois de guardar no servidor, recarregamos o feed real
        carregarFeedDaEscola(S.currentSchoolSlug);
      });
    }
  };
</script>


<!-- ═══════════════════════════════════════════════════════════════
     RESUMO DO PADRÃO (repete-se para cada módulo que fores ligando):

       1. Ao entrar num ecrã / módulo → apiGet(...) → mete o resultado
          dentro de S.<algo> → render().
       2. Ao submeter um formulário   → apiPost(...) → no .then(),
          recarrega os dados (apiGet outra vez) → render().

     Módulos com o mesmo padrão, por ordem sugerida de migração:
       - Notas do aluno   → GET /api/alunos/:id            (já pronto)
       - Pauta da turma   → GET /api/turmas/:id/notas       (já pronto)
       - Lançar nota      → POST /api/notas                 (já pronto)
       - Propinas         → GET /api/propinas?aluno_id=     (já pronto)
       - Pedir documento  → POST /api/pedidos-documentos    (já pronto)
       - Chamada/presença → GET+POST /api/presencas         (já pronto)
       - Chat             → GET+POST /api/conversas/:id/mensagens (já pronto)

     A API já tem rotas prontas para todos estes — ver README.md.
     ═══════════════════════════════════════════════════════════════ -->
